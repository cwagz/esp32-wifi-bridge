name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Get Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(git describe --always --dirty --tags)
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Build Firmware
        run: pio run
        env:
          FIRMWARE_VERSION: ${{ steps.version.outputs.version }}

      - name: Prepare Artifacts
        run: |
          mkdir release
          cp .pio/build/esp32-s3-devkitc-1/firmware.bin release/
          cp .pio/build/esp32-s3-devkitc-1/bootloader.bin release/
          cp .pio/build/esp32-s3-devkitc-1/partitions.bin release/
          cp .pio/build/esp32-s3-devkitc-1/ota_data_initial.bin release/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.version }}
          path: release/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          make_latest: true

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.build.outputs.version }}
          path: release

      - name: Prepare GitHub Pages
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"
          PAGES_BASE="https://${OWNER}.github.io/${REPO}"

          PREV_VERSION="none"
          PREV_SIZE="0"
          git fetch origin gh-pages --depth=1 || true
          if git cat-file -e origin/gh-pages:firmware.bin 2>/dev/null; then
            git show origin/gh-pages:firmware.bin > docs/firmware-previous.bin
            PREV_SIZE=$(stat --printf="%s" docs/firmware-previous.bin)
            if git cat-file -e origin/gh-pages:version.json 2>/dev/null; then
              PREV_VERSION=$(git show origin/gh-pages:version.json | grep -o '"version"[^,]*' | cut -d'"' -f4 || echo "none")
            fi
          fi

          cp release/*.bin docs/
          touch docs/.nojekyll
          SIZE=$(stat --printf="%s" release/firmware.bin)

          cat > docs/manifest.json << EOF
          {
            "name": "ESP32 WiFi Bridge",
            "version": "${VERSION}",
            "new_install_prompt_erase": true,
            "builds": [{
              "chipFamily": "ESP32-S3",
              "parts": [
                {"path": "bootloader.bin", "offset": 0},
                {"path": "partitions.bin", "offset": 32768},
                {"path": "ota_data_initial.bin", "offset": 61440},
                {"path": "firmware.bin", "offset": 131072}
              ]
            }]
          }
          EOF

          cat > docs/version.json << EOF
          {
            "version": "${VERSION}",
            "size": ${SIZE},
            "url": "${PAGES_BASE}/firmware.bin",
            "previous_version": "${PREV_VERSION}",
            "previous_size": ${PREV_SIZE},
            "previous_url": "${PAGES_BASE}/firmware-previous.bin"
          }
          EOF

      - name: Mirror site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
